name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal test dependencies
        run: python -m pip install Flask requests pytest
      - name: Validate repository
        run: python scripts/validate_install.py
      - name: Run tests
        run: python -m pytest -q
      - name: Start application and check HTTP liveness
        run: |
          python -m src.server.app > /tmp/nexusrpg-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health >/tmp/nexusrpg-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.4
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nexusrpg-server.log
            exit 1
          fi
          curl -fsS --max-time 3 http://127.0.0.1:8080/health
          curl -fsS --max-time 3 http://127.0.0.1:8080/ > /dev/null
