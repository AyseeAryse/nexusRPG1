name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal test dependencies
        run: python -m pip install Flask requests pytest
      - name: Validate repository
        run: python scripts/validate_install.py
      - name: Run tests
        run: python -m pytest -q
